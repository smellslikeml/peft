# kernels-library build manifest for the DoRA-factored kernel.
#
# Schema mirrors the `[general]` / `[general.hub]` blocks every kernels-community/*
# package ships (see huggingface/kernels examples/kernels/*). Stage A ships only the
# pure-PyTorch reference under torch-ext/, so there is no compiled `[kernel.*]` source
# to register yet. The `[torch]` + `[kernel.dora_factored]` blocks below show the exact
# shape Stage B (fused Triton) will populate once the sources land; they are commented
# out so the manifest is valid TOML today and the builder is not pointed at files that
# do not exist yet.
[general]
name = "dora-factored"
version = 1
edition = 5
license = "Apache-2.0"
# The fused kernel targets CUDA GPU (paper contribution #2). Stage A's PyTorch reference
# runs on CPU but is not a compiled backend.
backends = ["cuda"]

[general.hub]
# Intended publish target (not yet published — Stage B/C). Org is the maintainer's choice.
repo-id = "kernels-community/dora-factored-kernel"

